name: stcn probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test stcn entries from GitHub runner
        run: |
          for u in \
            "https://www.stcn.com/article/list/yw.html" \
            "https://m.stcn.com" \
            "https://h5.stcn.com" \
            "https://www.stcn.com" \
            "https://r.jina.ai/https://www.stcn.com/article/list/yw.html" \
            "https://r.jina.ai/https://www.stcn.com/article/detail/4327358.html" ; do
            code=$(curl -s -o /tmp/probe_out -w "%{http_code}" --max-time 25 "$u")
            sz=$(wc -c < /tmp/probe_out)
            echo "$code  ${sz}B  $u"
          done
